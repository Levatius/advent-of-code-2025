name: Python Tests

on:
  push:
    branches: [ "primary" ]
  pull_request:
    branches: [ "primary" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v1

    - id: tests
      name: Run tests
      env:
        AOC_SESSION: ${{ secrets.AOC_SESSION }}
      run: |
        uv run pytest --junitxml=speed-report.xml

    - name: Generate speed report markdown
      run: |
        python scripts/generate_speed_report.py > speed-report.md

    - name: Upload speed report to Gist
      uses: exuanbo/actions-deploy-gist@v1
      with:
        token: ${{ secrets.SPEED_REPORT_GIST_TOKEN }}
        gist_id: ${{ secrets.SPEED_REPORT_GIST_ID }}
        file_path: advent-of-code-2025-speed-report.md