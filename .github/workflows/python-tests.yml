name: Python Tests

on:
  push:
    branches: [ "primary" ]
  pull_request:
    branches: [ "primary" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v1

    - id: tests
      name: Run tests
      env:
        AOC_SESSION: ${{ secrets.AOC_SESSION }}
      run: |
        uv run pytest --junitxml=speed-report.xml

    - name: Generate speed report markdown
      run: |
        python scripts/generate_speed_report.py > speed-report.md
        cp speed-report.md README.md

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Update README.md [skip actions]"
        branch: primary
        file_pattern: README.md